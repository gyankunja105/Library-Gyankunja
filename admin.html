<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><meta name="robots" content="noindex,nofollow"><title>জ্ঞানকুঞ্জ অ্যাডমিন</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Serif+Bengali:wght@700;800&family=Galada&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=2.0"></head><body class="adm">
<header class="admin-header"><div class="wrap row"><div class="brand"><span class="brand-mark">জ</span><span>জ্ঞানকুঞ্জ <small>অ্যাডমিন কনসোল <span id="who"></span></small></span></div><button class="s hide" id="out">লগআউট ↗</button></div></header>
<main class="wrap admin-main"><div class="card login-card" id="login" style="max-width:440px;margin:40px auto"><div class="eyebrow">SECURE ACCESS</div><h2>অ্যাডমিন লগইন</h2><p class="mu">আপনার অনুমোদিত অ্যাকাউন্ট দিয়ে প্রবেশ করুন।</p><label>ইমেইল</label><input id="em" type="email" autocomplete="username"><label>পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password"><p><button id="lb">প্রবেশ করুন</button></p></div>
<div id="app" class="hide"><div class="tabs" id="tabs"></div><div id="view"></div></div></main><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY),$=i=>document.getElementById(i),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),money=n=>'৳'+Number(n||0).toLocaleString('bn-BD'),dt=t=>new Date(t).toLocaleString('bn-BD'),
toast=t=>{$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3200)},
SK=['admin','stock'],OR=['admin','orders'],AC=['admin','accounts'],
ST=['অনুরোধ পাঠানো হয়েছে','যাচাই চলছে','নিশ্চিত','প্রস্তুত','ডেলিভারি সম্পন্ন','বাতিল'],
CATS=['বই','খাতা ও কাগজ','স্টেশনারি','অফিস সামগ্রী','শিক্ষার্থী','আর্ট','অন্যান্য'],
T={dash:'📊 ড্যাশবোর্ড',orders:'📦 অর্ডার',products:'🏷️ পণ্য ও স্টক',pos:'🧾 বিক্রি (POS)',ledger:'💰 হিসাব'},V={};
let role,me,tab='dash',P=[];
const can=l=>l.includes(role),log=async(a,d)=>{await sb.from('audit').insert({by_email:me,action:a,detail:d})},
tbl=(h,r)=>`<div class="card tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')||`<tr><td colspan="${h.length}">এখনো কিছু নেই।</td></tr>`}</table></div>`;
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return show(false);
const{data}=await sb.from('staff').select('role').eq('user_id',session.user.id).maybeSingle();
if(!data){toast('এই অ্যাকাউন্টের অ্যাডমিন অনুমতি নেই');await sb.auth.signOut();return show(false)}
role=data.role;me=session.user.email;$('who').textContent=me+' · '+role;show(true);nav()}
function show(on){$('login').classList.toggle('hide',on);$('app').classList.toggle('hide',!on);$('out').classList.toggle('hide',!on)}
$('lb').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});error?toast('লগইন ব্যর্থ। ইমেইল ও পাসওয়ার্ড যাচাই করুন।'):init()};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
function nav(){const t={...T,...(role==='admin'?{history:'📜 ইতিহাস',staff:'👥 স্টাফ'}:{})};$('tabs').innerHTML=Object.entries(t).map(([k,v])=>`<button class="s ${k===tab?'on':''}" onclick="tab='${k}';nav()">${v}</button>`).join('');V[tab]()}

V.orders=async()=>{const{data}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
$('view').innerHTML=tbl(['সময়','ক্রেতা','পণ্য','মোট','অবস্থা'],(data||[]).map(o=>`<tr><td>${dt(o.created_at)}</td><td>${esc(o.name)}<br>${esc(o.phone)}<br><small>${esc(o.address)}</small></td><td>${o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td>${money(o.total)}</td><td><select data-o="${o.id}" ${can(OR)&&o.status!=='ডেলিভারি সম্পন্ন'?'':'disabled'}>${ST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`))+'<div class="note">অর্ডার "ডেলিভারি সম্পন্ন" করলে স্টক কমবে ও বিক্রি স্বয়ংক্রিয়ভাবে রেকর্ড হবে (একবারই; এরপর অবস্থা বদলানো যাবে না)।</div>'};

V.products=async()=>{const{data}=await sb.from('products').select('*').order('name');P=data||[];
$('view').innerHTML=(can(SK)?`<div class="card"><h3>পণ্য যোগ / সম্পাদনা</h3><form id="pf"><div class="f"><div><label>SKU (খালি রাখলে স্বয়ংক্রিয়)</label><input name="id"></div><div><label>পণ্যের নাম *</label><input name="name" required></div><div><label>বিভাগ</label><select name="cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>ক্রয়মূল্য</label><input name="cost" type="number" min="0" value="0"></div><div><label>বিক্রয়মূল্য</label><input name="price" type="number" min="0" value="0"></div><div><label>স্টক</label><input name="qty" type="number" min="0" value="0"></div><div><label>কম স্টক সতর্কতা</label><input name="min_qty" type="number" min="0" value="5"></div><div><label>ছবির URL</label><input name="image_url" type="url" placeholder="https://..."></div><div><label>অথবা ছবি আপলোড</label><input type="file" id="pi" accept="image/*"></div></div><label>বিবরণ</label><textarea name="descr" rows="2"></textarea><p><button>পণ্য সংরক্ষণ করুন</button></p></form></div>`:'')+
tbl(['SKU','পণ্য','স্টক','ক্রয়','বিক্রয়','কাজ'],P.map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.name)}<br><small>${esc(p.cat)}</small></td><td><b style="color:${p.qty===0?'#bd3030':p.qty<=p.min_qty?'#b36a00':'inherit'}">${p.qty}</b></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${can(SK)?`<button class="s" data-e="${esc(p.id)}">সম্পাদনা</button> <button class="s" data-s="${esc(p.id)}" data-g="1">স্টক ইন</button> <button class="s" data-s="${esc(p.id)}" data-g="-1">স্টক আউট</button> ${role==='admin'?`<button class="d" data-x="${esc(p.id)}">মুছুন</button>`:''}`:''}</td></tr>`));
if(can(SK))$('pf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.id=f.id.trim()||'GK-'+Date.now().toString().slice(-8);const fl=$('pi').files[0];if(fl){const u=await up(fl);if(!u)return;f.image_url=u}['cost','price','qty','min_qty'].forEach(k=>f[k]=+f[k]);
const{error}=await sb.from('products').upsert(f);if(error)return toast(error.message);await log('পণ্য সংরক্ষণ',f.name);toast('পণ্য সংরক্ষণ হয়েছে');nav()}};

V.pos=async()=>{const[a,b]=await Promise.all([sb.from('products').select('id,name,qty,price').gt('qty',0).order('name'),sb.from('sales').select('*').order('created_at',{ascending:false}).limit(40)]);
$('view').innerHTML=(can(SK)?`<div class="card"><h3>দোকানের বিক্রি</h3><form id="sf"><div class="f"><div><label>পণ্য</label><select name="p">${(a.data||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (স্টক ${p.qty}) ${money(p.price)}</option>`).join('')}</select></div><div><label>পরিমাণ</label><input name="q" type="number" min="1" value="1"></div><div><label>পেমেন্ট</label><select name="pay"><option>নগদ</option><option>মোবাইল ব্যাংকিং</option><option>কার্ড</option><option>বাকি</option></select></div><div><label>ক্রেতা (ঐচ্ছিক)</label><input name="c"></div></div><p><button>বিক্রি সম্পন্ন করুন</button></p></form></div>`:'')+
tbl(['সময়','পণ্য','পরিমাণ','বিক্রি','লাভ','পেমেন্ট'],(b.data||[]).map(s=>`<tr><td>${dt(s.created_at)}</td><td>${esc(s.name)}</td><td>${s.qty}</td><td>${money(s.total)}</td><td>${money(s.total-s.cost_total)}</td><td>${esc(s.payment)}</td></tr>`));
if(can(SK))$('sf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const{error}=await sb.rpc('record_sale',{p_id:f.p,p_qty:+f.q,p_pay:f.pay,p_cust:f.c});if(error)return toast(error.message);toast('বিক্রি রেকর্ড হয়েছে');nav()}};

V.ledger=async()=>{const[l,s]=await Promise.all([sb.from('ledger').select('*').order('date',{ascending:false}).limit(100),sb.from('sales').select('total,cost_total')]);
const L=l.data||[],sum=t=>L.filter(x=>x.type===t).reduce((a,x)=>a+x.amount,0),gross=(s.data||[]).reduce((a,x)=>a+x.total-x.cost_total,0),LB={investment:'মূলধন জমা',expense:'ব্যবসার খরচ',withdraw:'ব্যক্তিগত উত্তোলন'};
$('view').innerHTML=`<div class="card"><div class="m"><div>মূলধন<b>${money(sum('investment'))}</b></div><div>খরচ<b>${money(sum('expense'))}</b></div><div>বিক্রয় লাভ*<b>${money(gross)}</b></div><div>আনুমানিক নিট*<b>${money(gross-sum('expense'))}</b></div></div><small>*কর, বাকি আদায়, ফেরত ও অন্যান্য দায় অন্তর্ভুক্ত নয়।</small></div>`+
(can(AC)?`<div class="card"><h3>হিসাব যোগ</h3><form id="lf"><div class="f"><div><label>নাম / অংশীদার</label><input name="name" required></div><div><label>ধরন</label><select name="type">${Object.entries(LB).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div><label>পরিমাণ (৳)</label><input name="amount" type="number" min="1" required></div><div><label>তারিখ</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div></div><label>বিবরণ / রসিদ</label><input name="note"><p><button>হিসাব যোগ করুন</button></p></form></div>`:'')+
tbl(['তারিখ','নাম','ধরন','পরিমাণ','বিবরণ'],L.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${LB[x.type]}</td><td>${money(x.amount)}</td><td>${esc(x.note||'—')}</td></tr>`));
if(can(AC))$('lf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.amount=+f.amount;const{error}=await sb.from('ledger').insert(f);if(error)return toast(error.message);await log('হিসাব যোগ',f.name+' · '+f.type+' · '+f.amount);toast('হিসাব যোগ হয়েছে');nav()}};

V.history=async()=>{const{data}=await sb.from('audit').select('*').order('created_at',{ascending:false}).limit(100);$('view').innerHTML=tbl(['সময়','ব্যবহারকারী','কাজ','বিবরণ'],(data||[]).map(a=>`<tr><td>${dt(a.created_at)}</td><td>${esc(a.by_email)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`))};


async function up(file){try{const bm=await createImageBitmap(file),r=Math.min(1,900/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*r);c.height=Math.round(bm.height*r);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);const bl=await new Promise(y=>c.toBlob(y,'image/jpeg',.82)),path=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg',{error}=await sb.storage.from('product-images').upload(path,bl,{contentType:'image/jpeg'});if(error)throw error;return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}catch(e){toast('ছবি আপলোড ব্যর্থ: '+(e.message||e));return null}}
async function ex(t){const{data,error}=await sb.from(t).select('*').limit(5000);if(error||!data?.length)return toast(error?error.message:'কোনো ডেটা নেই');const k=Object.keys(data[0]),q=v=>{let s=String(typeof v==='object'&&v!==null?JSON.stringify(v):v??'');if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'},b=new Blob(['\uFEFF'+[k.join(','),...data.map(r=>k.map(c=>q(r[c])).join(','))].join('\r\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=t+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
V.dash=async()=>{const t0=new Date();t0.setHours(0,0,0,0);
const[s,o,p,n]=await Promise.all([sb.from('sales').select('total,cost_total').gte('created_at',t0.toISOString()),sb.from('orders').select('created_at,name,total,status').order('created_at',{ascending:false}).limit(6),sb.from('products').select('name,qty,min_qty').order('qty').limit(80),sb.from('orders').select('id',{count:'exact',head:true}).in('status',ST.slice(0,4))]);
const S=s.data||[],rev=S.reduce((a,x)=>a+x.total,0),pf=S.reduce((a,x)=>a+x.total-x.cost_total,0),low=(p.data||[]).filter(x=>x.qty<=x.min_qty),bc=t=>t==='ডেলিভারি সম্পন্ন'?'':t==='বাতিল'?' r':' w';
$('view').innerHTML=`<div class="dh"><h2 style="color:#fff;margin:0">স্বাগতম 👋</h2><div>${esc(me)} · আজকের ব্যবসা এক নজরে</div></div><div class="m" style="margin-top:14px"><div>আজকের বিক্রি<b>${money(rev)}</b></div><div>আজকের লাভ<b>${money(pf)}</b></div><div>চলমান অর্ডার<b>${n.count??0}</b></div><div>কম স্টক<b>${low.length}</b></div></div><div class="two"><div class="card"><h3>সাম্প্রতিক অর্ডার</h3>${(o.data||[]).map(x=>`<div class="li"><span>${esc(x.name)} · ${money(x.total)}</span><span class="bg${bc(x.status)}">${esc(x.status)}</span></div>`).join('')||'<p class="mu">কোনো অর্ডার নেই</p>'}</div><div class="card"><h3>⚠️ কম স্টক</h3>${low.slice(0,8).map(x=>`<div class="li"><span>${esc(x.name)}</span><b>${x.qty}</b></div>`).join('')||'<p class="mu">সব পণ্যের স্টক ঠিক আছে ✓</p>'}</div></div><div class="card"><h3>⬇️ ডেটা এক্সপোর্ট (CSV)</h3>${[['products','পণ্য'],['orders','অর্ডার'],['sales','বিক্রি'],['ledger','হিসাব']].map(([k,v])=>`<button class="s" data-ex="${k}">${v}</button> `).join('')}</div>`};
V.staff=async()=>{const{data}=await sb.from('staff').select('*').order('email'),R={admin:'অ্যাডমিন',accounts:'হিসাবরক্ষক',stock:'স্টক',orders:'অর্ডার',viewer:'শুধু দেখা'};
$('view').innerHTML=`<div class="card"><h3>নতুন স্টাফ যোগ</h3><p class="mu">আগে Supabase > Authentication > Users থেকে ইউজার বানান, তারপর এখানে ইমেইল ও ভূমিকা দিন।</p><form id="tf"><div class="f"><div><label>ইমেইল</label><input name="e" type="email" required></div><div><label>ভূমিকা</label><select name="r">${Object.entries(R).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><p><button>যোগ করুন</button></p></form></div>`+tbl(['ইমেইল','ভূমিকা',''],(data||[]).map(s=>`<tr><td>${esc(s.email)}</td><td>${R[s.role]}</td><td>${s.email===me?'(আপনি)':`<button class="d" data-t="${s.user_id}">সরান</button>`}</td></tr>`));
$('tf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),{error}=await sb.rpc('add_staff',{p_email:f.e,p_role:f.r});if(error)return toast(error.message);await log('স্টাফ যোগ',f.e+' · '+f.r);toast('স্টাফ যোগ হয়েছে');nav()}};

document.addEventListener('change',async e=>{const id=e.target.dataset.o;if(!id)return;const{error}=await sb.rpc('set_order_status',{p_id:id,p_status:e.target.value});toast(error?error.message:'অবস্থা আপডেট হয়েছে');nav();if(!error)log('অর্ডারের অবস্থা',id.slice(0,8)+' · '+e.target.value)});
document.addEventListener('click',async e=>{const d=e.target.dataset;
if(d.e){const p=P.find(x=>x.id===d.e),f=$('pf');for(const k in p)if(f.elements[k])f.elements[k].value=p[k]??'';f.scrollIntoView({behavior:'smooth'})}
if(d.s){const q=parseInt(prompt(d.g>0?'কতটি স্টক ইন?':'কতটি স্টক আউট/ক্ষতি?'));if(!q||q<1)return;const c=d.g>0?parseFloat(prompt('একক ক্রয়মূল্য (না জানলে 0)','0'))||0:0;const{error}=await sb.rpc('adjust_stock',{p_id:d.s,p_delta:q*d.g,p_note:'',p_cost:c});toast(error?error.message:'স্টক আপডেট হয়েছে');nav()}
if(d.ex)ex(d.ex);if(d.t&&confirm('স্টাফের অনুমতি সরাবেন?')){const{error}=await sb.from('staff').delete().eq('user_id',d.t);toast(error?error.message:'সরানো হয়েছে');if(!error)log('স্টাফ সরানো',d.t);nav()}
if(d.x&&confirm('পণ্যটি মুছবেন?')){const{error}=await sb.from('products').delete().eq('id',d.x);if(!error)await log('পণ্য মুছে ফেলা',d.x);toast(error?error.message:'মুছে ফেলা হয়েছে');nav()}});
init();
</script></body></html>
